name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        if: ${{ env.PAGES_TOKEN == '' }}
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Setup Pages with enablement
        id: pages_enablement
        if: ${{ env.PAGES_TOKEN != '' }}
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_TOKEN }}
          enablement: true
      - name: Upload artifact
        if: ${{ steps.pages.outcome == 'success' || steps.pages_enablement.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        if: ${{ steps.pages.outcome == 'success' || steps.pages_enablement.outcome == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Skip deploy when Pages is not configured
        if: ${{ steps.pages.outcome != 'success' && steps.pages_enablement.outcome != 'success' }}
        run: |
          echo "::warning::Skipping GitHub Pages deployment because GitHub Pages is not enabled for this repository."
          echo "::warning::Enable Pages in the repository settings or add a PAGES_TOKEN secret with repository administration and pages write permissions for first-time setup."
