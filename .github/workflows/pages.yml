name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Pages token
        id: pages_token
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -n "$PAGES_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Pages
        id: pages
        if: ${{ steps.pages_token.outputs.present != 'true' }}
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Setup Pages with enablement
        id: pages_enablement
        if: ${{ steps.pages_token.outputs.present == 'true' }}
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN }}
          enablement: true
      - name: Upload artifact
        if: ${{ steps.pages.outputs.base_url != '' || steps.pages_enablement.outputs.base_url != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        if: ${{ steps.pages.outputs.base_url != '' || steps.pages_enablement.outputs.base_url != '' }}
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Skip deploy when Pages is not configured
        if: ${{ steps.pages.outputs.base_url == '' && steps.pages_enablement.outputs.base_url == '' }}
        run: |
          echo "::warning::Skipping GitHub Pages deployment because GitHub Pages is not enabled for this repository."
          echo "::warning::Enable Pages in the repository settings or add a PAGES_TOKEN secret with repository administration and pages write permissions for first-time setup."
